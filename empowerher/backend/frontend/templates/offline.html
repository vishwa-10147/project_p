{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8e3b9d">
    <title>Offline - EmpowerHer</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
               font-family: Arial, Helvetica, sans-serif; background: #f7f5fb; color: #292238; }
        main { max-width: 460px; text-align: center; background: #fff; border-radius: 18px;
               padding: 32px 24px; box-shadow: 0 8px 30px rgba(77, 38, 127, 0.12); }
        img { width: 72px; height: 72px; }
        h1 { color: #8e3b9d; margin: 12px 0 8px; }
        .emergency { background: #fbeaec; color: #a52d3b; border-radius: 12px; padding: 14px; margin: 18px 0; }
        .emergency a { color: inherit; font-weight: bold; }
        a.button { display: inline-block; margin: 6px; padding: 10px 18px; border-radius: 999px;
                   background: #8e3b9d; color: #fff; text-decoration: none; font-weight: bold; }
        a.button.secondary { background: #f2ebff; color: #4d267f; }
    </style>
</head>
<body>
<main>
    <img src="{% static 'img/logo.svg' %}" alt="">
    <h1>You're offline</h1>
    <p>This page isn't saved on your phone yet. It will load again when you're connected.</p>
    <div class="emergency">
        In an emergency call <a href="tel:112">112</a>.
        Women Helpline: <a href="tel:181">181</a>.
        Cyber fraud: <a href="tel:1930">1930</a>.
    </div>
    <p>These pages work offline once you have opened them:</p>
    <a class="button" href="/safety/">Safety helplines</a>
    <a class="button secondary" href="/funding/">EMI calculator</a>
    <a class="button secondary" href="/">Home</a>
</main>
</body>
</html>
