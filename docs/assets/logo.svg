<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">EmpowerHer logo: a shield with a keyhole and two growing leaves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a24bb0"/>
      <stop offset="1" stop-color="#5a2785"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b93b"/>
      <stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
  </defs>
  <!-- App-icon background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Shield: privacy -->
  <path d="M256 84 L398 134 V250 C398 344 334 404 256 432 C178 404 114 344 114 250 V134 Z"
        fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <!-- Leaves: growth, sprouting from the keyhole -->
  <path d="M256 198 C252 162 228 142 190 144 C190 180 214 202 256 198 Z" fill="url(#leaf)"/>
  <path d="M256 198 C262 158 290 134 332 136 C332 176 304 202 256 198 Z" fill="url(#leaf)"/>
  <!-- Keyhole: encryption -->
  <circle cx="256" cy="244" r="42" fill="#ffffff"/>
  <path d="M236 268 H276 L292 354 H220 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
</svg>
